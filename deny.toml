# cargo-deny (ADR 0003): advisories, licenses and sources of every dependency.
# Owned by the maintainer: changing this file needs the harness-change label.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The CLI reads SQLite files it wrote itself, in the person's home; the
    # flaw needs a crafted -wal file next to one a less trusted party put
    # there. The fixed libsqlite3-sys 0.39 cannot be taken until sqlx allows
    # it (sqlx-sqlite 0.9.0 wants < 0.38, and Cargo links one sqlite3 only).
    { id = "RUSTSEC-2026-0459", reason = "rusqlite's bundled SQLite in the CLI only opens files the CLI wrote; waiting for sqlx to allow libsqlite3-sys 0.39" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses that may be combined with both the AGPL service and the MIT tools.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]

unused-allowed-license = "allow"

# Our own crates are not published; their licenses are set in each Cargo.toml.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
