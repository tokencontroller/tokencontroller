# cargo-deny (ADR 0003): advisories, licenses and sources of every dependency.
# Owned by the maintainer: changing this file needs the harness-change label.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # SQLite before 3.54 can read stale memory when it opens a database with a
    # crafted -wal file of another page size. Only the tc CLI links SQLite
    # (rusqlite, bundled), and it opens its own database in the user's own
    # folder, which only that user writes. The fixed libsqlite3-sys 0.39 cannot
    # be taken yet: sqlx 0.9 pins libsqlite3-sys below 0.38, and both link
    # sqlite3. Drop this once sqlx allows 0.39.
    { id = "RUSTSEC-2026-0459", reason = "tc opens only its own database; sqlx 0.9 blocks the fixed libsqlite3-sys" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses that may be combined with both the AGPL service and the MIT tools.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]

unused-allowed-license = "allow"

# Our own crates are not published; their licenses are set in each Cargo.toml.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
