name: Token Controller
description: Report what agents spend in CI, such as a pull request review bot, to Token Controller.
author: Jan Beck
branding:
  icon: check-circle
  color: green

inputs:
  token:
    description: A service token (tc_svc_…) from the web app, under Settings. Its creator is the person of every message this step reports.
    required: true
  project:
    description: The project of this job's work. Wins over a rule on the repository.
    required: false
  feature:
    description: The feature of this job's work. Wins over every rule. Without it, TC_FEATURE set by an earlier step is used.
    required: false
  tags:
    description: Any other tags, as name=value, separated by commas, spaces or new lines.
    required: false
  url:
    description: The address of a self-hosted Token Controller. Leave it out for the hosted service.
    required: false
    default: https://app.tokencontroller.com

outputs:
  messages:
    description: How many messages this step reported.

runs:
  using: node24
  main: dist/main.js
