[workspace]
resolver = "3"
members = ["apps/server", "crates/core"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/tokencontroller/tokencontroller"
publish = false

[workspace.dependencies]
tokencontroller-core = { path = "crates/core" }
anyhow = "1.0.104"
axum = "0.8.9"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

# The strict harness (ADR 0003). Owned by the maintainer: changing this block
# needs the harness-change label. Tests may use unwrap and friends through
# clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "forbid"
expect_used = "deny"     # deny, not forbid: #[tokio::main] and #[tokio::test] allow it in generated code; scripts/harness-check forbids lint attributes in our own code (ADR 0013)
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
float_arithmetic = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
cast_possible_truncation = "forbid"
let_underscore_must_use = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
dbg_macro = "forbid"
print_stdout = "deny"

[profile.release]
overflow-checks = true
