[workspace]
resolver = "3"
members = ["apps/cli", "apps/server", "crates/core"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/tokencontroller/tokencontroller"
publish = false

[workspace.dependencies]
tokencontroller-core = { path = "crates/core" }
base64 = "0.22.1"
getrandom = "0.4.3"
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
mail-parser = "0.11.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.0"
proptest = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["time", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
wiremock = "0.6.5"

# The strict harness (ADR 0003). Owned by the maintainer: changing this block
# needs the harness-change label. Tests may use unwrap and friends through
# clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "forbid"
expect_used = "deny"     # deny, not forbid: #[tokio::main] and #[tokio::test] allow it in generated code; scripts/harness_check.py forbids lint attributes in our own code (ADR 0013)
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"     # deny, not forbid: sqlx::query! allows it in generated code; scripts/harness_check.py forbids lint attributes in our own code (ADR 0013)
indexing_slicing = "forbid"
string_slice = "forbid"
float_arithmetic = "forbid"
arithmetic_side_effects = "forbid"
as_conversions = "forbid"
cast_possible_truncation = "forbid"
let_underscore_must_use = "forbid"
unused_result_ok = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
dbg_macro = "forbid"
print_stdout = "deny"

[profile.release]
overflow-checks = true
