# One pnpm workspace for every TypeScript project in this repo.
packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Security fixes Dependabot cannot make: parents pin an exact vulnerable version.
overrides:
  undici: 8.12.2
  seroval: 1.6.11
  postcss-selector-parser: 6.1.5
  "minimatch@5": 6.2.2
