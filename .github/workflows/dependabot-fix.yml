# When a Dependabot upgrade pull request fails its checks, Claude Code fixes
# the branch: a renamed API, a migration, a changed default. Dependabot keeps
# doing the plain upgrades for free; Claude only steps in when they break.
# One attempt per pull request: once Claude has pushed, a later failure is
# left to the daily check. Claude pushes as the Claude GitHub App, so the
# push starts CI again (a push with the workflow token would not).
# Runs started by Dependabot only see Dependabot secrets, so ANTHROPIC_API_KEY
# (and TOKEN_CONTROLLER_TOKEN, to report the cost to our own organization)
# live under Settings > Secrets > Dependabot. Without the key nothing runs.
name: Fix Dependabot upgrade

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix the upgrade
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
      && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: No key, no fix
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No ANTHROPIC_API_KEY Dependabot secret; the upgrade stays red for the daily check."
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Decide whether to fix
        id: before
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          # Only the commit that failed, and only once per pull request.
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "The branch moved on since this run; its own run decides."; exit 0
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open pull request for $BRANCH."; exit 0; fi
          if git log --format='%an' origin/main..HEAD | grep -qv '^dependabot\[bot\]$'; then
            echo "Someone other than Dependabot already pushed to #$pr; not trying again."; exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Fix
        if: steps.before.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "dependabot[bot]"
          prompt: |
            Dependabot's upgrade pull request #${{ steps.before.outputs.pr }} in ${{ github.repository }} (branch ${{ github.event.workflow_run.head_branch }}, checked out here) failed its checks: ${{ github.event.workflow_run.html_url }}. CLAUDE.md at the root says how this repository works.

            Find why with `gh run view --log-failed` on that run, then fix the code so it works with the new versions: a renamed or removed API, a changed default, a migration the library's changelog asks for. Read the changelog of the upgraded package before you change anything. Keep the upgrade; never pin a package back to the old version unless the new one cannot work at all, and then say why. Never skip, disable or weaken a test or a lint to get green. Make the smallest change that works, run the fast checks for what you touched (cargo check --workspace and cargo clippy --workspace for Rust, the package's build and test for TypeScript), then commit with a message saying what changed and why, and `git push origin HEAD:${{ github.event.workflow_run.head_branch }}`. CI runs again on the push and the pull request merges itself when green.

            If you cannot fix it, push nothing and comment on the pull request in two plain sentences: what breaks and what it would take.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
      - name: Report the cost to our Token Controller organization
        if: always() && steps.before.outputs.run == 'true'
        env:
          TOKEN_CONTROLLER_TOKEN: ${{ secrets.TOKEN_CONTROLLER_TOKEN }}
        run: |
          if [ -z "$TOKEN_CONTROLLER_TOKEN" ]; then
            echo "No TOKEN_CONTROLLER_TOKEN Dependabot secret; cost not reported."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - uses: tokencontroller/tokencontroller/packages/github-action@v1
        if: always() && steps.before.outputs.run == 'true' && env.skip != 'true'
        continue-on-error: true
        with:
          project: tokencontroller
          tags: purpose=dependency-upgrade
          token: ${{ secrets.TOKEN_CONTROLLER_TOKEN }}
