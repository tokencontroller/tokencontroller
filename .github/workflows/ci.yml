# CI (ADR 0011): runs on every push and pull request. Only the review job
# reads a secret, and it passes without one.
# A pull request merges itself once every job is green, unless it carries the
# `hold` label. A push to main publishes the image to
# ghcr.io/tokencontroller/tokencontroller; a version tag adds version tags.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://tc:secret@localhost:5432/tc
  IMAGE: ghcr.io/tokencontroller/tokencontroller

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find who set the harness-change label
        id: label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'harness-change')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          by=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "harness-change")] | last | .actor.login // empty' \
            | tail -n 1)
          echo "by=$by" >> "$GITHUB_OUTPUT"
      - name: Check the harness
        env:
          HARNESS_LABEL_BY: ${{ steps.label.outputs.by }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/harness_check.py $BASE

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tc
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tc"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Apply migrations for compile-time query checks
        run: |
          for file in apps/server/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci --no-tests=fail
      - name: Every test in the code ran
        run: python3 scripts/harness_check.py --tests-ran target/nextest/ci/junit.xml
      - name: Summary
        if: always()
        run: |
          report=target/nextest/ci/junit.xml
          if [ -f "$report" ]; then
            python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          tests, failures, errors = (int(root.get(k, 0)) for k in ("tests", "failures", "errors"))
          print("### Rust\n")
          print("- No unsafe code, no crash points, no floats in money: the lint block forbids them.")
          print(f"- {tests} tests ran, {failures + errors} failed, none skipped.\n")
          PY
          fi

  mutants:
    # Mutation testing (ADR 0003) of the core lines a pull request changes, so
    # a test that checks nothing blocks the merge. The nightly run covers the
    # whole crate.
    name: Mutation testing of changed core code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the changed core code
        id: diff
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git diff "$BASE...HEAD" -- crates/core > core.diff
          if [ -s core.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "### Mutation testing" >> "$GITHUB_STEP_SUMMARY"
            echo "- No core code changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the pinned toolchain
        if: steps.diff.outputs.changed == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.changed == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.diff.outputs.changed == 'true'
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Mutate the changed lines and test
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          cargo mutants --package tokencontroller-core --in-diff core.diff --test-tool nextest --jobs 4 2>&1 | tee mutants.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Mutation testing"
            echo
            line=$(grep -E 'mutants tested|[Nn]o mutants|no Rust source' mutants.log | tail -n 1 | sed 's/^ *INFO *//')
            echo "- ${line:-No mutants in the changed lines.}"
            if [ -s mutants.out/missed.txt ]; then
              echo "- Not caught by any test:"
              sed 's/^/  - /' mutants.out/missed.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Exit code 3 means a mutant made the tests hang, which counts as caught.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
      - name: Keep the report
        if: failure() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutants
          path: mutants.out

  deny:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Image and end-to-end smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tokencontroller:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it with the self-hosting compose file
        run: scripts/smoke-test tokencontroller:ci

  publish:
    name: Publish the image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [harness, rust, deny, typescript, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo "Published:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    # Claude reviews the pull request (safety backlog, Jan 2026-10-20): inline
    # comments and one summary, and the job fails only for a bug it confirmed
    # in the changed code, so the merge waits for a bug and for nothing else.
    # Without the ANTHROPIC_API_KEY secret the job passes and says so. The
    # label `review-waived` passes a wrong finding (a label starts CI again).
    name: Claude review
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: No key, no review
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No ANTHROPIC_API_KEY secret in this repository; no review ran, the merge is not blocked."
      - name: Decide whether a review runs
        id: before
        if: env.ANTHROPIC_API_KEY != ''
        run: python3 .github/scripts/claude_review.py before
      - name: Review
        id: review
        if: steps.before.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. The diff to review is in .claude-review/diff.patch, and the repository is checked out at the pull request's head commit, so read the surrounding code with Read, Grep and Glob wherever the diff alone does not tell you whether a change is right. CLAUDE.md at the root says how this repository works.

            You look for bugs in the changed code: wrong output, a crash, lost or corrupted data, a security hole, a check that no longer checks anything. Before you call something a bug, confirm it in the code: find the caller, the type, the test or the migration that proves it, and give up the finding when the code proves you wrong. A real bug is rare; most pull requests are clean.

            For every confirmed bug, post one inline comment on the line with mcp__github_inline_comment__create_inline_comment: what goes wrong, in which situation, and what would fix it, in three sentences at most. Up to three suggestions that are not bugs (a simpler way, a missing test, an edge case worth a thought) may also go in as inline comments that start with "Suggestion:". Nothing about style, naming, formatting or comments; linters cover that, and nobody reads such comments here.

            Finish with the structured output: verdict "bug" when at least one confirmed bug exists, "clean" otherwise; a summary of one or two plain sentences for a reader who will not open the diff; and the list of bugs with file, line and a short title. The verdict "bug" blocks the merge, so give it only for a defect you confirmed.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["bug","clean"]},"summary":{"type":"string"},"bugs":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"}},"required":["file","title"]}}},"required":["verdict","summary","bugs"]}'
      - name: Verdict
        if: steps.before.outputs.run == 'true'
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: python3 .github/scripts/claude_review.py after

  automerge:
    name: Merge when green
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'hold')
    needs: [harness, rust, mutants, deny, typescript, image, review]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      - name: Wait for the other required checks
        # The ruleset on main also requires the CodeQL analyses, which run in
        # their own workflow and often finish after this job starts. Merging
        # before they report is refused.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --required --watch --interval 20
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"
      - name: Start CI on main to publish the image
        # A merge made with the workflow token starts no push run of its own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
