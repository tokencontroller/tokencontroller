# CI (ADR 0011): runs on every push and pull request. Only the review job
# reads a secret, and it passes without one.
# The review job switches GitHub's auto merge on when the change is clean
# (ADR 0013). GitHub then waits for every required check, puts the pull
# request in the merge queue, where CI runs once more together with those
# ahead of it (merge_group), and merges it when that run is green. The label
# `hold` switches auto merge off. A push to main publishes the image to
# ghcr.io/tokencontroller/tokencontroller; a version tag adds version tags.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
    tags: ["v*"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://tc:secret@localhost:5432/tc
  IMAGE: ghcr.io/tokencontroller/tokencontroller

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find who set the harness-change label
        id: label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'harness-change')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          by=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "harness-change")] | last | .actor.login // empty' \
            | tail -n 1)
          echo "by=$by" >> "$GITHUB_OUTPUT"
      - name: Check the harness
        env:
          HARNESS_LABEL_BY: ${{ steps.label.outputs.by }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/harness_check.py $BASE

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tc
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tc"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Apply migrations for compile-time query checks
        run: |
          for file in apps/server/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci --no-tests=fail
      - name: Every test in the code ran
        run: python3 scripts/harness_check.py --tests-ran target/nextest/ci/junit.xml
      - name: Summary
        if: always()
        run: |
          report=target/nextest/ci/junit.xml
          if [ -f "$report" ]; then
            python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          tests, failures, errors = (int(root.get(k, 0)) for k in ("tests", "failures", "errors"))
          print("### Rust\n")
          print("- No unsafe code, no crash points, no floats in money: the lint block forbids them.")
          print(f"- {tests} tests ran, {failures + errors} failed, none skipped.\n")
          PY
          fi

  mutants:
    # Mutation testing (ADR 0003) of the core lines a pull request changes, so
    # a test that checks nothing blocks the merge. The nightly run covers the
    # whole crate.
    name: Mutation testing of changed core code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the changed core code
        id: diff
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git diff "$BASE...HEAD" -- crates/core > core.diff
          if [ -s core.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "### Mutation testing" >> "$GITHUB_STEP_SUMMARY"
            echo "- No core code changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the pinned toolchain
        if: steps.diff.outputs.changed == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.changed == 'true'
      - uses: taiki-e/install-action@v2
        if: steps.diff.outputs.changed == 'true'
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Mutate the changed lines and test
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          cargo mutants --package tokencontroller-core --in-diff core.diff --test-tool nextest --jobs 4 2>&1 | tee mutants.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Mutation testing"
            echo
            line=$(grep -E 'mutants tested|[Nn]o mutants|no Rust source' mutants.log | tail -n 1 | sed 's/^ *INFO *//')
            echo "- ${line:-No mutants in the changed lines.}"
            if [ -s mutants.out/missed.txt ]; then
              echo "- Not caught by any test:"
              sed 's/^/  - /' mutants.out/missed.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Exit code 3 means a mutant made the tests hang, which counts as caught.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
      - name: Keep the report
        if: failure() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mutants
          path: mutants.out

  deny:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Image and end-to-end smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tokencontroller:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it with the self-hosting compose file
        run: scripts/smoke-test tokencontroller:ci

  publish:
    name: Publish the image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [harness, rust, deny, typescript, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo "Published:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  review:
    # Claude reviews the pull request (safety backlog, Jan 2026-10-20) and,
    # when the change is clean, switches GitHub's auto merge on (Jan,
    # 2026-10-29): inline comments and one summary, the job fails only for a
    # bug it confirmed in the changed code, and the pull request merges only
    # after the review switched auto merge on. The action signs in as the
    # Claude GitHub App (no github_token input, id-token: write), because
    # GitHub runs the merge queue's CI for what an app does and not for the
    # workflow's own token. Without the CLAUDE_CODE_OAUTH_TOKEN secret (Jan's
    # subscription token, a repository secret) the job passes and says so,
    # and nothing switches auto merge on. The label `review-waived` passes a
    # wrong finding; the label `hold` switches auto merge off (a label starts
    # CI again).
    name: Claude review
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: No token, no review
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "No CLAUDE_CODE_OAUTH_TOKEN secret in this repository; no review ran, the merge is not blocked, and nothing switches auto merge on."
      - name: Decide what runs
        id: before
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: python3 .github/scripts/claude_review.py before
      - name: Review
        id: review
        if: steps.before.outputs.mode == 'review'
        uses: anthropics/claude-code-action@v1
        # A review that cannot run (no credit, an outage) is reported and
        # never blocks: the verdict step turns a missing result into
        # "unfinished".
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. First read .claude/skills/reviewing-pull-requests/SKILL.md and follow it exactly: it says what to read, what to look for, how to confirm a finding, what to post and how to end. The diff to review is in .claude-review/diff.patch. The repository is checked out at the pull request's head commit, so read the surrounding code, the docs and the decisions with Read, Grep and Glob wherever the diff alone does not tell you whether a change is right. When your verdict is clean, run exactly `gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --auto --squash` before you end; for the verdicts bug and needs-jan run nothing.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr merge:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["bug","clean","needs-jan"]},"summary":{"type":"string"},"bugs":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"}},"required":["file","title"]}}},"required":["verdict","summary","bugs"]}'
      - name: Verdict
        if: steps.before.outputs.mode == 'review'
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: python3 .github/scripts/claude_review.py after
      - name: Switch auto merge on
        # For a commit that was reviewed already, a waived finding or a diff
        # with nothing to review: the app's sign-in exists only inside the
        # action, so the action runs this one command.
        if: steps.before.outputs.mode == 'arm'
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run exactly this one command, then end: `gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --auto --squash`. If it says auto merge is enabled already, that is fine. Read nothing, post nothing.
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 3
            --allowedTools "Bash(gh pr merge:*)"
      - name: Auto merge is on
        if: steps.before.outputs.mode == 'arm'
        run: python3 .github/scripts/claude_review.py armed
